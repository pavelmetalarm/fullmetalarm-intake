name: Telegram intake

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-intake
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poll Telegram
        env:
          TELEGRAM_INTAKE_BOT_TOKEN: ${{ secrets.TELEGRAM_INTAKE_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: pavelmetalarm
          PROJECT_NUMBER: '8'
        run: python intake/poll.py
      # Runs even when the poll step failed: poll.py writes the cursor before
      # raising, and that progress must survive or every item it already
      # created will be created again on the next run.
      - name: Commit cursor
        if: always()
        run: |
          if ! git diff --quiet -- state/offset.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/offset.json
            git commit -m "chore(state): advance intake cursor"
            git push
          fi
